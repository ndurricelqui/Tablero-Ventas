  function parseSKU(skuStr) {
    if (!skuStr) return { codigo: '', color: '', talle: '' };
    const parts = skuStr.trim().split('-');
    if (parts.length < 2) return { codigo: skuStr.trim(), color: '', talle: '' };
    const talle = parts[parts.length - 1];
    const color = parts[parts.length - 2];
    const codigo = parts.slice(0, parts.length - 2).join('-');
    return { codigo, color, talle };
  }

    if (el) { el.innerHTML = debugLog.slice(-40).map(l => `<div>${l}</div>`).join(''); el.scrollTop = el.scrollHeight; }
  }
  function toggleDebug() {
    const el = document.getElementById('debugPanel');
    el.style.display = el.style.display === 'none' ? 'block' : 'none';
  }

  // CSV PARSER
  function parseCSV(text) {
    const rows = [];
    let row = [], cur = '', inQ = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (inQ) {
        if (ch === '"' && text[i+1] === '"') { cur += '"'; i++; }
        else if (ch === '"') inQ = false;
        else cur += ch;
      } else {
        if (ch === '"') { inQ = true; }
        else if (ch === ',') { row.push(cur); cur = ''; }
        else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
        else if (ch === '\r') { /* skip */ }
        else cur += ch;
      }
    }
    if (cur || row.length) { row.push(cur); rows.push(row); }
    return rows.filter(r => r.some(c => c.trim()));
  }

  function applyVentasGviz(data) {
    const allRows = data.table.rows || [];
    if (!allRows.length) { ventasData = []; ventasHeaders = []; ventasColTypes = []; return; }
    const gvizCols = data.table.cols || [];
    const hasLabels = gvizCols.some(c => c.label && c.label.trim());
    let dataRows;
    if (hasLabels) {
      ventasHeaders = gvizCols.map(c => c.label || c.id || '');
      ventasColTypes = gvizCols.map(c => c.type || 'string');
      dataRows = allRows;
    } else {
      const hRow = allRows[0];
      ventasHeaders = (hRow.c || []).map((cell, i) => (cell && cell.v != null ? String(cell.v).trim() : `Col${i+1}`));
      ventasColTypes = gvizCols.map(c => c.type || 'string');
      dataRows = allRows.slice(1);
    }
    const colCount = ventasHeaders.length;
    ventasData = dataRows.filter(row => row && row.c).map(row => {
      return Array.from({ length: colCount }, (_, i) => {
        const cell = row.c ? row.c[i] : null;
        if (!cell) return null;
        if (cell.f && (ventasColTypes[i] === 'date' || ventasColTypes[i] === 'datetime')) return cell.f;
        return cell.v !== undefined ? cell.v : null;
      });
    }).filter(row => row.some(v => v !== null && v !== ''));
  }

  async function loadVentasSheetData() {
    if (VENTAS_SHEETS_ID) {
      try {
        const gvizData = await new Promise((resolve, reject) => {
          const cb = '__gviz_v_' + Date.now();
          const url = `https://docs.google.com/spreadsheets/d/${VENTAS_SHEETS_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}&gid=${VENTAS_GID}`;
          log(`Fetching Ventas gviz: ${url}`);
          const script = document.createElement('script');
          const cleanup = () => { delete window[cb]; script.remove(); };
          const timer = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 8000);
          window[cb] = d => { clearTimeout(timer); cleanup(); resolve(d); };
          script.onerror = () => { clearTimeout(timer); cleanup(); reject(new Error('script error')); };
          script.src = url;
          document.head.appendChild(script);
        });
        if (gvizData.status !== 'error') {
          applyVentasGviz(gvizData);
          log(`✓ Ventas gviz: ${ventasData.length} filas — cols: ${ventasHeaders.join(', ')}`);
          return;
        }
      } catch (e) {
        log(`Ventas gviz falló (${e.message}), intentando CSV…`);
      }
    }
    const csvUrl = `https://docs.google.com/spreadsheets/d/e/${VENTAS_PUB_ID}/pub?gid=${VENTAS_GID}&single=true&output=csv`;
    log(`Fetching Ventas CSV: ${csvUrl}`);
    const res = await fetch(csvUrl);
    if (!res.ok) throw new Error(`HTTP ${res.status} al cargar ventas`);
    const text = await res.text();
    const rows = parseCSV(text);
    if (!rows.length) { ventasData = []; ventasHeaders = []; ventasColTypes = []; return; }
    ventasHeaders = rows[0].map(h => h.trim());
    const colCount = ventasHeaders.length;
    ventasColTypes = Array.from({ length: colCount }, (_, i) => {
      const samples = rows.slice(1, 21).map(r => (r[i] || '').trim()).filter(Boolean);
      if (!samples.length) return 'string';
      const numOk = samples.filter(s => !isNaN(s.replace(/[$.,%\s]/g,'').replace(',','.'))).length;
      return numOk / samples.length >= 0.6 ? 'number' : 'string';
    });
    ventasData = rows.slice(1).map(row =>
      Array.from({ length: colCount }, (_, i) => {
        const raw = (row[i] ?? '').trim();
        if (!raw) return null;
        if (ventasColTypes[i] === 'number') {
          const n = parseFloat(raw.replace(/\./g,'').replace(',','.').replace(/[^0-9.\-]/g,''));
          return isNaN(n) ? raw : n;
        }
        return raw;
      })
    ).filter(row => row.some(v => v !== null && v !== ''));
    log(`✓ Ventas CSV: ${ventasData.length} filas — cols: ${ventasHeaders.join(', ')}`);
  }

  async function loadData() {
    debugLog = [];
    document.getElementById('ventasLoading').style.display = 'block';
    document.getElementById('ventasContent').style.display = 'none';

    } catch(e) {

    }
    document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('es-AR');
  }

  // VENTAS HELPERS
  function fmtPesos(n) {
    if (n == null || isNaN(n)) return '—';
    return '$ ' + Math.round(n).toLocaleString('es-AR');
  }

  function getVentasCols() {
    const hLow = ventasHeaders.map(h => norm(h));
    const find = (...kws) => {
      const sorted = [...kws].sort((a, b) => b.length - a.length);
      for (const k of sorted) {
        const idx = hLow.findIndex(h => h.includes(norm(k)));
        if (idx >= 0) return idx;
      }
      return -1;
    };
    return {
      totalCol:        find('monto neto', 'importe total', 'total general', 'total', 'importe', 'subtotal', 'neto', 'monto', 'valor', 'precio', 'facturado', 'venta'),
      cantCol:         find('cantidad', 'cant', 'unidades', 'qty'),
      fechaCol:        find('fecha', 'date'),
      vendedorCol:     find('vendedor'),
      codigoCol:       find('codigo', 'cod', 'sku', 'articulo', 'producto'),
      comprobanteCol:  find('comprobante', 'nro comprobante', 'numero comprobante', 'nro. comprobante', 'factura', 'nro factura', 'numero'),
      descCol:         find('descripcion', 'descripción', 'detalle', 'nombre', 'desc'),
      colorCol:        find('color'),
      talleCol:        find('talle', 'size'),
      listaCol:        find('lista'),
      origenCol:       find('origen', 'sucursal'),
      proveedorCol:    find('proveedor - nombre', 'proveedor'),
      clienteCol:      find('cliente'),
    };
  }

  function parseVentasFecha(str) {
    if (!str) return null;
    str = String(str).trim();
    let m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (m) return new Date(+m[3], +m[2]-1, +m[1]);
    m = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return new Date(+m[1], +m[2]-1, +m[3]);
    const d = new Date(str);
    return isNaN(d) ? null : d;
  }

  function applyVentasFiltros(rows, cols) {
    return rows.filter(row => {
      if ((vFechaDesde || vFechaHasta) && cols.fechaCol >= 0) {
        const d = parseVentasFecha(row[cols.fechaCol]);
        if (d) {
          if (vFechaDesde) { const dd = parseVentasFecha(vFechaDesde); if (dd && d < dd) return false; }
          if (vFechaHasta) { const dh = parseVentasFecha(vFechaHasta); if (dh && d > dh) return false; }
        }
      }
      if (vVendedores.size > 0 && cols.vendedorCol >= 0) {
        if (!vVendedores.has(String(row[cols.vendedorCol] ?? '').trim())) return false;
      }
      if (vColoresFilter.size > 0 && cols.colorCol >= 0) {
        if (!vColoresFilter.has(String(row[cols.colorCol] ?? '').trim())) return false;
      }
      if (vTallesFilter.size > 0 && cols.talleCol >= 0) {
        if (!vTallesFilter.has(String(row[cols.talleCol] ?? '').trim())) return false;
      }
      if (vListaFilter.size > 0 && cols.listaCol >= 0) {
        if (!vListaFilter.has(String(row[cols.listaCol] ?? '').trim())) return false;
      }
      if (vOrigenFilter.size > 0 && cols.origenCol >= 0) {
        if (!vOrigenFilter.has(String(row[cols.origenCol] ?? '').trim())) return false;
      }
      if (vArticulosFilter.size > 0 && cols.codigoCol >= 0) {
        const rawCod = String(row[cols.codigoCol] ?? '').trim();
        const { codigo } = parseSKU(rawCod);
        const baseCod = (CODIGO_ALIAS[(codigo || rawCod).toUpperCase()] || (codigo || rawCod)).toUpperCase();
        if (!vArticulosFilter.has(baseCod) && !vArticulosFilter.has(rawCod.toUpperCase())) return false;
      }
      if (vProveedoresFilter.size > 0 && cols.proveedorCol >= 0) {
        if (!vProveedoresFilter.has(String(row[cols.proveedorCol] ?? '').trim())) return false;
      }
      return true;
    });
  }

  function computeVentasProductStats(filtered, cols) {
    const byProd = {};
    let sumaTotal = 0, sumaUnits = 0;
    filtered.forEach(row => {
      const rawCod = cols.codigoCol >= 0 ? String(row[cols.codigoCol] ?? '').trim() : '';
      const { codigo } = parseSKU(rawCod);
      const baseKey = (CODIGO_ALIAS[(codigo || rawCod).toUpperCase()] || (codigo || rawCod)).toUpperCase();
      const key = baseKey || '(sin código)';
      const cat = getCatalog(key) || getCatalog(rawCod);
      const rawDesc = cols.descCol >= 0 ? String(row[cols.descCol] ?? '').trim() : '';
      const desc = rawDesc || (cat ? cat.desc : (ALIAS_DESC[key] || ''));
      const units = cols.cantCol >= 0 ? (parseFloat(row[cols.cantCol] ?? 0) || 0) : 0;
      const total = cols.totalCol >= 0 ? (parseFloat(row[cols.totalCol] ?? 0) || 0) : 0;
      if (!byProd[key]) byProd[key] = { key, desc: desc || key, units: 0, total: 0, ops: 0 };
      else if (!byProd[key].desc && desc) byProd[key].desc = desc;
      byProd[key].units += units;
      byProd[key].total += total;
      byProd[key].ops += 1;
      sumaTotal += total;
      sumaUnits += units;
    });
    return { byProd, sumaTotal, sumaUnits, nOps: filtered.length };
  }

  function computeVentasMonthStats(filtered, cols) {
    const byMonth = {};
    filtered.forEach(row => {
      if (cols.fechaCol < 0) return;
      const d = parseVentasFecha(row[cols.fechaCol]);
      if (!d || isNaN(d)) return;
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      if (!byMonth[key]) byMonth[key] = { units: 0, total: 0 };
      if (cols.cantCol >= 0) byMonth[key].units += parseFloat(row[cols.cantCol] ?? 0) || 0;
      if (cols.totalCol >= 0) byMonth[key].total += parseFloat(row[cols.totalCol] ?? 0) || 0;
    });
    return byMonth;
  }

  function computeDateRangeMonths(filtered, cols) {
    if (cols.fechaCol < 0) return 1;
    let minD = null, maxD = null;
    filtered.forEach(row => {
      const d = parseVentasFecha(row[cols.fechaCol]);
      if (!d || isNaN(d)) return;
      if (!minD || d < minD) minD = d;
      if (!maxD || d > maxD) maxD = d;
    });
    if (!minD || !maxD) return 1;
    const months = (maxD.getFullYear() - minD.getFullYear()) * 12 + (maxD.getMonth() - minD.getMonth()) + 1;
    return Math.max(1, months);
  }

  // Determina a qué grupo de "mayorista" pertenece una lista de precios.
  // Incluye tanto la lista "Mayorista" propiamente dicha como "Lista 3",
  // que es la lista usada para distribuidoras y también es venta mayorista.
  function mayoristaGrupoDeLista(lista) {
    const n = norm(lista);
    if (n.includes('mayorista')) return 'Mayorista';
    if (n.includes('lista 3') || n.includes('lista3') || n.includes('distribuidora')) return 'Lista 3 (Distribuidora)';
    return null;
  }

  function computeMayoristaClientes(filtered, cols) {
    if (cols.listaCol < 0 || cols.comprobanteCol < 0) return { facturas: [], distinctClientCount: 0, groups: [] };
    const facturas = {};
    filtered.forEach(row => {
      const lista = String(row[cols.listaCol] ?? '').trim();
      const grupo = mayoristaGrupoDeLista(lista);
      if (!grupo) return;
      const comp = String(row[cols.comprobanteCol] ?? '').trim();
      if (!comp) return;
      const key = grupo + '||' + comp;
      if (!facturas[key]) {
        const rawCliente = cols.clienteCol >= 0 ? String(row[cols.clienteCol] ?? '').trim() : '';
        const { codigo: clienteCodigo, nombre: clienteNombre } = parseCliente(rawCliente);
        facturas[key] = {
          comprobante: comp,
          lista, grupo,
          vendedor: cols.vendedorCol >= 0 ? String(row[cols.vendedorCol] ?? '').trim() : '',
          fecha: cols.fechaCol >= 0 ? String(row[cols.fechaCol] ?? '').trim() : '',
          fechaObj: cols.fechaCol >= 0 ? parseVentasFecha(row[cols.fechaCol]) : null,
          clienteKey: clienteCodigo || clienteNombre || '(sin cliente)',
          clienteCodigo,
          clienteNombre: clienteNombre || '(sin cliente)',
          total: 0, unidades: 0, items: []
        };
      }
      const cant = cols.cantCol >= 0 ? (parseFloat(row[cols.cantCol] ?? 0) || 0) : 0;
      const monto = cols.totalCol >= 0 ? (parseFloat(row[cols.totalCol] ?? 0) || 0) : 0;
      const rawCod = cols.codigoCol >= 0 ? String(row[cols.codigoCol] ?? '').trim() : '';
      const { codigo } = parseSKU(rawCod);
      const baseKey = (CODIGO_ALIAS[(codigo || rawCod).toUpperCase()] || (codigo || rawCod)).toUpperCase();
      const cat = getCatalog(baseKey) || getCatalog(rawCod);
      const rawDesc = cols.descCol >= 0 ? String(row[cols.descCol] ?? '').trim() : '';
      const desc = rawDesc || (cat ? cat.desc : (ALIAS_DESC[baseKey] || ''));
      facturas[key].total += monto;
      facturas[key].unidades += cant;
      facturas[key].items.push({
        codigo: baseKey || rawCod || '(s/código)',
        desc,
        color: cols.colorCol >= 0 ? String(row[cols.colorCol] ?? '').trim() : '',
        talle: cols.talleCol >= 0 ? String(row[cols.talleCol] ?? '').trim() : '',
        cantidad: cant, monto
      });
    });

    const facturasArr = Object.values(facturas);
    const distinctClientCount = new Set(facturasArr.map(f => f.clienteKey)).size;

    // Agrupa por lista (Mayorista / Lista 3) y, dentro de cada grupo, por cliente.
    const gruposMap = {};
    facturasArr.forEach(f => {
      if (!gruposMap[f.grupo]) gruposMap[f.grupo] = {};
      const clientes = gruposMap[f.grupo];
      if (!clientes[f.clienteKey]) {
        clientes[f.clienteKey] = {
          clienteKey: f.clienteKey, groupKey: f.grupo + '||' + f.clienteKey,
          clienteCodigo: f.clienteCodigo, clienteNombre: f.clienteNombre,
          facturas: [], total: 0, unidades: 0
        };
      }
      clientes[f.clienteKey].facturas.push(f);
      clientes[f.clienteKey].total += f.total;
      clientes[f.clienteKey].unidades += f.unidades;
    });

    const GRUPO_ORDEN = ['Mayorista', 'Lista 3 (Distribuidora)'];
    const groups = Object.keys(gruposMap)
      .sort((a,b) => GRUPO_ORDEN.indexOf(a) - GRUPO_ORDEN.indexOf(b))
      .map(grupo => {
        const clientes = Object.values(gruposMap[grupo]);
        clientes.forEach(c => {
          c.facturas.sort((a,b) =>
            (b.fechaObj ? b.fechaObj.getTime() : 0) - (a.fechaObj ? a.fechaObj.getTime() : 0) || a.comprobante.localeCompare(b.comprobante)
          );
        });
        clientes.sort((a,b) => b.total - a.total || a.clienteNombre.localeCompare(b.clienteNombre));
        const total = clientes.reduce((s,c) => s + c.total, 0);
        const unidades = clientes.reduce((s,c) => s + c.unidades, 0);
        return { grupo, clientes, total, unidades, facturaCount: clientes.reduce((s,c) => s + c.facturas.length, 0) };
      });

    return { facturas: facturasArr, distinctClientCount, groups };
  }

  const MESES_ES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

  function renderVentasArtDropdown() {
    const inp = document.getElementById('vArticuloInput');
    const dd = document.getElementById('vArtDropdown');
    if (!inp || !dd) return;
    const cols = getVentasCols();
    if (cols.codigoCol < 0) { dd.style.display = 'none'; return; }
    const t = norm(inp.value);
    const allProductos = [...new Set(ventasData.map(r => {
      const rawCod = String(r[cols.codigoCol] ?? '').trim();
      const { codigo } = parseSKU(rawCod);
      return (CODIGO_ALIAS[(codigo||rawCod).toUpperCase()] || (codigo||rawCod)).toUpperCase();
    }).filter(Boolean))].sort();
    const matches = allProductos.filter(p => {
      const cat = getCatalog(p);
      return !t || norm(p).includes(t) || (cat && norm(cat.desc).includes(t));
    }).slice(0, 20);
    if (!matches.length) { dd.style.display = 'none'; return; }
    dd.innerHTML = matches.map(p => {
      const sel = vArticulosFilter.has(p);
      const cat = getCatalog(p);
      const desc = cat ? cat.desc : (ALIAS_DESC[p] || '');
      const e = p.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      return `<div class="sf-dd-item${sel?' sf-dd-selected':''}" onmousedown="vArticulosFilter.has('${e}')?vArticulosFilter.delete('${e}'):vArticulosFilter.add('${e}');vArticuloSearch='';document.getElementById('vArtDropdown').style.display='none';renderVentas()">
        <span class="sf-dd-check">${sel?'✓':''}</span>
        <span style="font-family:var(--mono);font-weight:700;color:var(--accent2);font-size:.82rem">${p}</span>
        ${desc?`<span style="color:var(--muted);font-size:.75rem;margin-left:.3rem">${desc}</span>`:''}
      </div>`;
    }).join('');
    dd.style.display = 'block';
  }

  function renderVentasProvDropdown() {
    const inp = document.getElementById('vProveedorInput');

  function clearVentasFiltros() {
    vFechaDesde = ''; vFechaHasta = ''; vMesRapido = '';
    vVendedores.clear(); vArticulosFilter.clear(); vColoresFilter.clear();
    vTallesFilter.clear(); vListaFilter.clear(); vOrigenFilter.clear(); vProveedoresFilter.clear();
    vArticuloSearch = ''; vProveedorSearch = '';
    renderVentas();
  }

  function applyMesRapido() {
    if (!vMesRapido) { vFechaDesde = ''; vFechaHasta = ''; return; }
    const [y, m] = vMesRapido.split('-');
    const lastDay = new Date(+y, +m, 0).getDate();
    vFechaDesde = `${y}-${m}-01`;
    vFechaHasta = `${y}-${m}-${String(lastDay).padStart(2,'0')}`;
  }

  function computeVentasDayStats(filtered, cols) {
    const byDay = {};
    filtered.forEach(row => {
      if (cols.fechaCol < 0) return;
      const d = parseVentasFecha(row[cols.fechaCol]);
      if (!d || isNaN(d)) return;
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      if (!byDay[key]) byDay[key] = { units: 0, total: 0 };
      if (cols.cantCol >= 0) byDay[key].units += parseFloat(row[cols.cantCol] ?? 0) || 0;
      if (cols.totalCol >= 0) byDay[key].total += parseFloat(row[cols.totalCol] ?? 0) || 0;
    });
    return byDay;
  }

  function computeByField(filtered, colIdx, cantColIdx, totalColIdx) {
    if (colIdx < 0) return {};
    const map = {};
    filtered.forEach(row => {
      const key = String(row[colIdx] ?? '').trim();
      if (!key) return;
      const cant  = cantColIdx  >= 0 ? (parseFloat(row[cantColIdx]  ?? 0) || 0) : 1;
      const total = totalColIdx >= 0 ? (parseFloat(row[totalColIdx] ?? 0) || 0) : 0;
      if (!map[key]) map[key] = { total: 0, units: 0, count: 0 };
      map[key].total += total;
      map[key].units += cant;
      map[key].count += 1;
    });
    return map;
  }

  function computeByProveedor(filtered, cols) {
    const map = {};
    filtered.forEach(row => {
      let provs;
      if (cols.proveedorCol >= 0) {
        const pv = String(row[cols.proveedorCol] ?? '').trim();
        provs = pv ? [pv] : ['Sin proveedor'];
      } else if (cols.codigoCol >= 0) {
        const rawCod = String(row[cols.codigoCol] ?? '').trim();
        const { codigo } = parseSKU(rawCod);
        const baseKey = (CODIGO_ALIAS[(codigo || rawCod).toUpperCase()] || (codigo || rawCod)).toUpperCase();
        const cat = getCatalog(baseKey) || getCatalog(rawCod);
        provs = (cat && cat.proveedores && cat.proveedores.length) ? cat.proveedores : ['Sin proveedor'];
      } else {
        provs = ['Sin proveedor'];
      }
      const total = cols.totalCol >= 0 ? (parseFloat(row[cols.totalCol] ?? 0) || 0) : 0;
      provs.forEach(p => {
        if (!map[p]) map[p] = { total: 0, count: 0 };
        map[p].total += total;
        map[p].count += 1;
      });
    });
    return map;
  }

  function renderVentas() {
    const loading = document.getElementById('ventasLoading');
    const content = document.getElementById('ventasContent');
    if (!ventasData.length) {
      loading.innerHTML = '<span style="color:var(--muted)">No se encontraron datos de ventas.</span>';
      return;
    }
    loading.style.display = 'none';
    content.style.display = 'block';

    const cols = getVentasCols();
    const filtered = applyVentasFiltros(ventasData, cols);
    const { byProd, sumaTotal, sumaUnits, nOps } = computeVentasProductStats(filtered, cols);
    const byMonth = computeVentasMonthStats(filtered, cols);
    const byDay   = computeVentasDayStats(filtered, cols);
    const meses = computeDateRangeMonths(filtered, cols);
    const mayoristaData = computeMayoristaClientes(filtered, cols);
    const byColor  = computeByField(filtered, cols.colorCol,  cols.cantCol, cols.totalCol);
    const byTalle  = computeByField(filtered, cols.talleCol,  cols.cantCol, cols.totalCol);
    const byLista  = computeByField(filtered, cols.listaCol,  cols.cantCol, cols.totalCol);
    const byOrigen = computeByField(filtered, cols.origenCol, cols.cantCol, cols.totalCol);
    const byVendedor = computeByField(filtered, cols.vendedorCol, cols.cantCol, cols.totalCol);
    const byProv   = computeByProveedor(filtered, cols);

    const allVendedores = cols.vendedorCol >= 0
      ? [...new Set(ventasData.map(r => String(r[cols.vendedorCol] ?? '').trim()).filter(Boolean))].sort()
      : [];
    const allProductos = cols.codigoCol >= 0
      ? [...new Set(ventasData.map(r => {
          const rawCod = String(r[cols.codigoCol] ?? '').trim();
          const { codigo } = parseSKU(rawCod);
          return (CODIGO_ALIAS[(codigo||rawCod).toUpperCase()] || (codigo||rawCod)).toUpperCase();
        }).filter(Boolean))].sort()
      : [];

    const hasFilters = vFechaDesde || vFechaHasta || vVendedores.size > 0 || vArticulosFilter.size > 0 || vColoresFilter.size > 0 || vTallesFilter.size > 0 || vListaFilter.size > 0 || vOrigenFilter.size > 0 || vProveedoresFilter.size > 0;

    let nFacturas = filtered.length;
    if (cols.comprobanteCol >= 0) {
      const compSet = new Set(filtered.map(r => String(r[cols.comprobanteCol] ?? '').trim()).filter(Boolean));
      if (compSet.size > 0) nFacturas = compSet.size;
    }
    const ticketProm = nFacturas > 0 && sumaTotal > 0 ? sumaTotal / nFacturas : 0;
    const ticketByLista = {};
    if (cols.listaCol >= 0) {
      const listaTotals = {}, listaComps = {};
      filtered.forEach(row => {
        const lista = String(row[cols.listaCol] ?? '').trim();
        if (!lista) return;
        if (!listaTotals[lista]) { listaTotals[lista] = 0; listaComps[lista] = new Set(); }
        listaTotals[lista] += cols.totalCol >= 0 ? (parseFloat(row[cols.totalCol] ?? 0) || 0) : 0;
        if (cols.comprobanteCol >= 0) {
          const comp = String(row[cols.comprobanteCol] ?? '').trim();
          if (comp) listaComps[lista].add(comp);
        }
      });
      Object.keys(listaTotals).sort().forEach(lista => {
        const nF = listaComps[lista].size > 0 ? listaComps[lista].size :
                   filtered.filter(r => String(r[cols.listaCol] ?? '').trim() === lista).length;
        ticketByLista[lista] = nF > 0 ? listaTotals[lista] / nF : 0;
      });
    }
    const unidXMes   = meses > 0 ? Math.round(sumaUnits / meses) : 0;
    const activeDays = Object.values(byDay).filter(d => d.total > 0).length || 1;
    const avgVentaDiaria = sumaTotal / activeDays;

    const availableMonths = cols.fechaCol >= 0
      ? [...new Set(ventasData.map(r => {
          const d = parseVentasFecha(r[cols.fechaCol]);
          if (!d) return null;
          return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        }).filter(Boolean))].sort().reverse()
      : [];

    let chipsHTML = '';
    if (vFechaDesde || vFechaHasta) {
      const label = [vFechaDesde && `desde ${vFechaDesde}`, vFechaHasta && `hasta ${vFechaHasta}`].filter(Boolean).join(' ');
      chipsHTML += `<span class="sf-chip">${label}<button class="sf-chip-remove" onclick="vFechaDesde='';vFechaHasta='';renderVentas()">✕</button></span>`;
    }
    [...vVendedores].forEach(v  => { const e=v.replace(/'/g,"\\'"); chipsHTML+=`<span class="sf-chip">👤 ${v}<button class="sf-chip-remove" onclick="vVendedores.delete('${e}');renderVentas()">✕</button></span>`; });
    [...vArticulosFilter].forEach(a => { const e=a.replace(/'/g,"\\'"); chipsHTML+=`<span class="sf-chip">📦 ${a}<button class="sf-chip-remove" onclick="vArticulosFilter.delete('${e}');renderVentas()">✕</button></span>`; });
    [...vColoresFilter].forEach(c  => { const e=c.replace(/'/g,"\\'"); chipsHTML+=`<span class="sf-chip">🎨 ${c}<button class="sf-chip-remove" onclick="vColoresFilter.delete('${e}');renderVentas()">✕</button></span>`; });
    [...vTallesFilter].forEach(t   => { const e=t.replace(/'/g,"\\'"); chipsHTML+=`<span class="sf-chip">📐 ${t}<button class="sf-chip-remove" onclick="vTallesFilter.delete('${e}');renderVentas()">✕</button></span>`; });
    [...vListaFilter].forEach(l    => { const e=l.replace(/'/g,"\\'"); chipsHTML+=`<span class="sf-chip">💰 ${l}<button class="sf-chip-remove" onclick="vListaFilter.delete('${e}');renderVentas()">✕</button></span>`; });
    [...vOrigenFilter].forEach(o   => { const e=o.replace(/'/g,"\\'"); chipsHTML+=`<span class="sf-chip">🏪 ${o}<button class="sf-chip-remove" onclick="vOrigenFilter.delete('${e}');renderVentas()">✕</button></span>`; });
    [...vProveedoresFilter].forEach(p => { const e=p.replace(/'/g,"\\'"); chipsHTML+=`<span class="sf-chip">🏭 ${p}<button class="sf-chip-remove" onclick="vProveedoresFilter.delete('${e}');renderVentas()">✕</button></span>`; });

    const allProveedoresVentas = cols.proveedorCol >= 0
      ? [...new Set(ventasData.map(r => String(r[cols.proveedorCol] ?? '').trim()).filter(Boolean))].sort()
      : [];

    const vendedorItems = allVendedores.map(v => {
      const sel = vVendedores.has(v);
      const e = v.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      return `<div class="sf-dd-item${sel?' sf-dd-selected':''}" onmousedown="vVendedores.has('${e}')?vVendedores.delete('${e}'):vVendedores.add('${e}');renderVentas()">
        <span class="sf-dd-check">${sel?'✓':''}</span><span style="font-size:.82rem">${v}</span></div>`;
    }).join('');

    const artQuery = norm(vArticuloSearch);
    const prodMatches = allProductos.filter(p => {
      const cat = getCatalog(p);
      return !artQuery || norm(p).includes(artQuery) || (cat && norm(cat.desc).includes(artQuery));
    }).slice(0, 20);
    const articuloItems = prodMatches.map(p => {
      const sel = vArticulosFilter.has(p);
      const cat = getCatalog(p);
      const desc = cat ? cat.desc : (ALIAS_DESC[p] || '');
      const e = p.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      return `<div class="sf-dd-item${sel?' sf-dd-selected':''}" onmousedown="vArticulosFilter.has('${e}')?vArticulosFilter.delete('${e}'):vArticulosFilter.add('${e}');vArticuloSearch='';document.getElementById('vArtDropdown').style.display='none';renderVentas()">
        <span class="sf-dd-check">${sel?'✓':''}</span>
        <span style="font-family:var(--mono);font-weight:700;color:var(--accent2);font-size:.82rem">${p}</span>
        ${desc?`<span style="color:var(--muted);font-size:.75rem;margin-left:.3rem">${desc}</span>`:''}
      </div>`;
    }).join('');

    const dayKeys = Object.keys(byDay).sort();
    let fechaLabels, fechaVals, fechaBadge;
    if (dayKeys.length > 0 && dayKeys.length <= 120) {
      fechaLabels = dayKeys.map(k => { const [y,mo,d]=k.split('-'); return `${d}/${mo}`; });
      fechaVals   = dayKeys.map(k => Math.round(byDay[k].total));
      fechaBadge  = `${dayKeys.length} días`;
    } else {
      const monthKeys = Object.keys(byMonth).sort().slice(-18);
      fechaLabels = monthKeys.map(k => { const [y,mo]=k.split('-'); return MESES_ES[parseInt(mo)-1]+(monthKeys.length>12?` ${y.slice(2)}`:''); });
      fechaVals   = monthKeys.map(k => Math.round(byMonth[k].total));
      fechaBadge  = `${monthKeys.length} meses`;
    }
    const fechaMA = fechaVals.map((v,i) => {
      const sl = fechaVals.slice(Math.max(0,i-2), i+1);
      return Math.round(sl.reduce((s,x)=>s+x,0)/sl.length);
    });

    const topArts = Object.values(byProd).sort((a,b)=>b.total-a.total).slice(0,40);
    const artLabels = topArts.map(p => p.key);
    const artVals   = topArts.map(p => Math.round(p.total));
    const artPcts   = topArts.map(p => (p.total / (sumaTotal || 1) * 100).toFixed(1));
    const topProvs    = Object.entries(byProv).filter(([,v]) => v.total > 0).sort((a,b)=>b[1].total-a[1].total).slice(0,40);
    const provLabels  = topProvs.map(([k]) => k.length > 22 ? k.slice(0,20)+'…' : k);
    const provVals    = topProvs.map(([,v]) => Math.round(v.total));
    const provPcts    = topProvs.map(([,v]) => (v.total / (sumaTotal || 1) * 100).toFixed(1));

    const TALLEORD = ['MCH','XS','CH','S','M','4','G','L','5','MG','XL','6','MMG','XXL'];
    const talleEntries = Object.entries(byTalle).sort((a,b) => {
      const ia = TALLEORD.indexOf(a[0].toUpperCase()), ib = TALLEORD.indexOf(b[0].toUpperCase());
      if (ia>=0&&ib>=0) return ia-ib;
      const na=parseFloat(a[0]),nb=parseFloat(b[0]);
      if (!isNaN(na)&&!isNaN(nb)) return na-nb;
      return a[0].localeCompare(b[0]);
    });
    const talleLabels = talleEntries.map(([k])=>k);
    const talleUnits  = talleEntries.map(([,v])=>Math.round(v.units));
    const colorEntries = Object.entries(byColor).sort((a,b)=>b[1].units-a[1].units).slice(0,14);
    const colorLabels  = colorEntries.map(([k])=>k);
    const colorUnits   = colorEntries.map(([,v])=>Math.round(v.units));
    const listaEntries = Object.entries(byLista).sort((a,b)=>b[1].total-a[1].total);
    const listaLabels  = listaEntries.map(([k])=>k);
    const listaVals    = listaEntries.map(([,v])=>Math.round(v.total));
    const origenEntries = Object.entries(byOrigen).sort((a,b)=>b[1].total-a[1].total);
    const origenLabels  = origenEntries.map(([k])=>k);
    const origenVals    = origenEntries.map(([,v])=>Math.round(v.total));
    const vendedorEntries = Object.entries(byVendedor).sort((a,b)=>b[1].total-a[1].total);
    const vendedorLabels  = vendedorEntries.map(([k])=>k);
    const vendedorVals    = vendedorEntries.map(([,v])=>Math.round(v.total));

    const DONUT_COLORS = ['#1e3a8a','#7c3aed','#0369a1','#059669','#d97706','#dc2626','#db2777','#0891b2','#65a30d','#ea580c','#6d28d9','#0f766e','#92400e','#1f2937'];

    let artDetailHTML = '';
    if (vArticulosFilter.size > 0) {
      const artList = [...vArticulosFilter];
      const artDesc = artList.map(a => { const c=getCatalog(a); return c?`${a} — ${c.desc.slice(0,40)}`:a; }).join(' + ');
      const provStr = artList.length===1 ? (()=>{ const c=getCatalog(artList[0]); return c&&c.proveedores.length?c.proveedores.join(', '):''; })() : '';
      artDetailHTML = `<div class="panel" style="margin-bottom:1rem;border-left:3px solid var(--accent2)">
        <div class="panel-header">
          <div><div class="panel-title">📦 ${artDesc}</div>${provStr?`<div style="font-size:.72rem;color:var(--muted);margin-top:3px;font-family:var(--mono)">${provStr}</div>`:''}</div>
          <div style="display:flex;gap:.5rem;align-items:center">
            <span class="badge success">${fmtPesos(sumaTotal)}</span>
            <span class="badge">${Math.round(sumaUnits).toLocaleString('es-AR')} u</span>
          </div>
        </div>
      </div>`;
    }

    const mayoristaFacturas = mayoristaData.facturas;
    const mayoristaTotal = mayoristaData.groups.reduce((s,g) => s + g.total, 0);
    const mayoristaUnidades = mayoristaData.groups.reduce((s,g) => s + g.unidades, 0);
    const mayoristaPorVendedor = {};
    mayoristaFacturas.forEach(f => {
      const v = f.vendedor || '(sin vendedor)';
      mayoristaPorVendedor[v] = (mayoristaPorVendedor[v] || 0) + 1;
    });
    const mayoristaVendedorEntries = Object.entries(mayoristaPorVendedor).sort((a,b) => b[1]-a[1]);

    const mayoristaFacturaRow = f => {
      const expanded = vMayoristaExpandido.has(f.comprobante);
      const esc = f.comprobante.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      const itemsHTML = f.items.map(it => `
        <tr>
          <td style="font-family:var(--mono);font-weight:700;color:var(--accent2);font-size:.8rem">${it.codigo}</td>
          <td style="font-size:.8rem;color:var(--muted)">${it.desc}</td>
          <td style="font-family:var(--mono);font-size:.78rem;text-align:center">${it.color}</td>
          <td style="font-family:var(--mono);font-size:.78rem;text-align:center">${it.talle}</td>
          <td style="font-family:var(--mono);font-weight:700;text-align:right">${Math.round(it.cantidad).toLocaleString('es-AR')}</td>
          <td style="font-family:var(--mono);font-size:.8rem;text-align:right">${fmtPesos(it.monto)}</td>
        </tr>`).join('');
      return `
      <div style="border-bottom:1px solid var(--surface2)">
        <div style="display:flex;align-items:center;gap:.75rem;padding:.55rem 1.25rem .55rem 2.5rem;cursor:pointer" onclick="vMayoristaExpandido.has('${esc}')?vMayoristaExpandido.delete('${esc}'):vMayoristaExpandido.add('${esc}');renderVentas()">
          <span style="font-family:var(--mono);font-size:.7rem;color:var(--muted);width:.9rem;flex-shrink:0">${expanded?'▾':'▸'}</span>
          <span style="font-family:var(--mono);font-weight:700;font-size:.85rem">${f.comprobante}</span>
          <span style="font-size:.78rem;color:var(--muted)">${f.vendedor || '—'}</span>
          <span style="font-family:var(--mono);font-size:.72rem;color:var(--muted)">${f.fecha || '—'}</span>
          <span style="margin-left:auto;font-family:var(--mono);font-size:.7rem;color:var(--muted);white-space:nowrap">${f.items.length} ítem${f.items.length!==1?'s':''} · ${Math.round(f.unidades)} u</span>
          <span class="badge success">${fmtPesos(f.total)}</span>
        </div>
        ${expanded ? `<div class="table-wrap" style="padding:0 1.25rem .75rem 3.9rem">
          <table>
            <thead><tr><th>Código</th><th>Descripción</th><th style="text-align:center">Color</th><th style="text-align:center">Talle</th><th style="text-align:right">Cant.</th><th style="text-align:right">Monto</th></tr></thead>
            <tbody>${itemsHTML}</tbody>
          </table>
        </div>` : ''}
      </div>`;
    };

    const mayoristaClienteRow = c => {
      const expanded = vMayoristaClienteExpandido.has(c.groupKey);
      const esc = c.groupKey.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      return `
      <div style="border-bottom:1px solid var(--surface2)">
        <div style="display:flex;align-items:center;gap:.75rem;padding:.7rem 1.25rem;cursor:pointer" onclick="vMayoristaClienteExpandido.has('${esc}')?vMayoristaClienteExpandido.delete('${esc}'):vMayoristaClienteExpandido.add('${esc}');renderVentas()">
          <span style="font-family:var(--mono);font-size:.72rem;color:var(--muted);width:1rem;flex-shrink:0">${expanded?'▾':'▸'}</span>
          ${c.clienteCodigo ? `<span style="font-family:var(--mono);font-weight:700;color:var(--accent2);font-size:.78rem">${c.clienteCodigo}</span>` : ''}
          <span style="font-weight:600;font-size:.88rem">${c.clienteNombre}</span>
          <span style="margin-left:auto;font-family:var(--mono);font-size:.7rem;color:var(--muted);white-space:nowrap">${c.facturas.length} factura${c.facturas.length!==1?'s':''} · ${Math.round(c.unidades)} u</span>
          <span class="badge success">${fmtPesos(c.total)}</span>
        </div>
        ${expanded ? c.facturas.map(mayoristaFacturaRow).join('') : ''}
      </div>`;
    };

    const mayoristaGroupsHTML = mayoristaData.groups.map(g => `
      <div style="border-bottom:1px solid var(--surface2)">
        <div style="display:flex;align-items:center;gap:.6rem;padding:.6rem 1.25rem;background:var(--surface2)">
          <span style="font-weight:700;font-size:.82rem">${g.grupo}</span>
          <span style="font-family:var(--mono);font-size:.7rem;color:var(--muted)">${g.clientes.length} cliente${g.clientes.length!==1?'s':''} · ${g.facturaCount} factura${g.facturaCount!==1?'s':''} · ${Math.round(g.unidades)} u</span>
          <span class="badge success" style="margin-left:auto">${fmtPesos(g.total)}</span>
        </div>
        ${g.clientes.map(mayoristaClienteRow).join('')}
      </div>`).join('');

    Object.values(_vCharts).forEach(c => { try { c && c.destroy(); } catch(e){} });
    _vCharts = {};

    content.innerHTML = `
      <div class="panel" style="margin-bottom:1rem;position:relative;z-index:100;overflow:visible">
        <div class="filter-bar" style="gap:.6rem;flex-wrap:wrap">
          <span class="filter-label">Mes</span>
          <select onchange="vMesRapido=this.value;applyMesRapido();renderVentas()" style="margin-bottom:0;font-family:var(--mono);font-size:.8rem;border:1.5px solid var(--border);border-radius:8px;padding:.35rem .7rem;background:#fff;color:var(--text);outline:none;cursor:pointer;${vMesRapido?'border-color:var(--accent2);background:#eff6ff;':''}">
            <option value="">Todos los meses</option>
            ${availableMonths.map(m => { const [y,mo]=m.split('-'); return `<option value="${m}"${vMesRapido===m?' selected':''}>${MESES_ES[parseInt(mo)-1]} ${y}</option>`; }).join('')}
          </select>
          <span class="filter-label" style="margin-left:.25rem">Período</span>
          <input type="date" value="${vFechaDesde}" onchange="vFechaDesde=this.value;vMesRapido='';renderVentas()" style="margin-bottom:0;width:150px;font-size:.8rem;padding:.35rem .7rem">
          <span style="color:var(--muted);font-size:.8rem">→</span>
          <input type="date" value="${vFechaHasta}" onchange="vFechaHasta=this.value;vMesRapido='';renderVentas()" style="margin-bottom:0;width:150px;font-size:.8rem;padding:.35rem .7rem">
          ${allVendedores.length ? `
            <span class="filter-label" style="margin-left:.25rem">Vendedor</span>
            <div style="position:relative">
              <button class="btn-sm${vVendedores.size>0?' v-filter-active':''}"
                onclick="const d=document.getElementById('vVendDropdown');d.style.display=d.style.display==='none'?'block':'none'"
                onblur="setTimeout(()=>{const d=document.getElementById('vVendDropdown');if(d)d.style.display='none'},200)">
                Vendedor${vVendedores.size>0?` (${vVendedores.size})`:' ▾'}</button>
              <div id="vVendDropdown" style="display:none;position:absolute;top:calc(100% + 4px);left:0;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:8px;max-height:260px;overflow-y:auto;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.18)">${vendedorItems}</div>
            </div>` : ''}
          ${allProductos.length ? `
            <span class="filter-label" style="margin-left:.25rem">Artículo</span>
            <div style="position:relative;z-index:50">
              <input type="text" id="vArticuloInput" value="${vArticuloSearch.replace(/"/g,'&quot;')}" placeholder="Buscar…"
                style="margin-bottom:0;width:160px;font-size:.8rem;padding:.35rem .7rem"
                oninput="vArticuloSearch=this.value;renderVentasArtDropdown()"
                onfocus="renderVentasArtDropdown()"
                onblur="setTimeout(()=>{const d=document.getElementById('vArtDropdown');if(d)d.style.display='none'},200)">
              <div id="vArtDropdown" style="display:none;position:absolute;top:calc(100% + 4px);left:0;min-width:260px;background:var(--surface);border:1px solid var(--border);border-radius:8px;max-height:260px;overflow-y:auto;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.18)">${articuloItems}</div>
            </div>` : ''}
          ${allProveedoresVentas.length ? `
            <span class="filter-label" style="margin-left:.25rem">Proveedor</span>
            <div style="position:relative;z-index:50">
              <input type="text" id="vProveedorInput" value="${vProveedorSearch.replace(/"/g,'&quot;')}" placeholder="Buscar…"
                style="margin-bottom:0;width:160px;font-size:.8rem;padding:.35rem .7rem"
                oninput="vProveedorSearch=this.value;renderVentasProvDropdown()"
                onfocus="renderVentasProvDropdown()"
                onblur="setTimeout(()=>{const d=document.getElementById('vProvDropdown');if(d)d.style.display='none'},200)">
              <div id="vProvDropdown" style="display:none;position:absolute;top:calc(100% + 4px);left:0;min-width:240px;background:var(--surface);border:1px solid var(--border);border-radius:8px;max-height:260px;overflow-y:auto;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.18)"></div>
            </div>` : ''}
          ${hasFilters ? `<button class="btn-clear" onclick="clearVentasFiltros()" style="margin-left:auto">✕ Limpiar filtros</button>` : ''}
        </div>
        ${chipsHTML ? `<div style="display:flex;flex-wrap:wrap;gap:.4rem;padding:.5rem 1.25rem .75rem">${chipsHTML}</div>` : ''}
      </div>

      ${artDetailHTML}

      <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:1rem">
        <div class="kpi" style="--kpi-color:var(--green)">
          <div class="kpi-label">Facturación</div>
          <div class="kpi-value" style="font-size:1.35rem">${fmtPesos(sumaTotal)}</div>
          <div class="kpi-sub">${nOps.toLocaleString('es-AR')} filas · ${nFacturas.toLocaleString('es-AR')} facturas</div>
        </div>
        <div class="kpi" style="--kpi-color:var(--purple)">
          <div class="kpi-label">Unidades</div>
          <div class="kpi-value">${Math.round(sumaUnits).toLocaleString('es-AR')}</div>
          <div class="kpi-sub">${unidXMes.toLocaleString('es-AR')} u/mes promedio</div>
        </div>
        <div class="kpi" style="--kpi-color:var(--accent2);cursor:pointer;user-select:none" onclick="const d=this.querySelector('.ticket-lista-detail');if(d)d.style.display=d.style.display==='none'?'block':'none'">
          <div class="kpi-label">Ticket Promedio <span style="font-size:.6rem;color:var(--muted)">▾ por lista</span></div>
          <div class="kpi-value" style="font-size:1.35rem">${fmtPesos(ticketProm)}</div>
          <div class="kpi-sub">por factura · ${nFacturas} facturas</div>
          <div class="ticket-lista-detail" style="display:none;margin-top:.5rem;border-top:1px solid var(--border);padding-top:.4rem">
            ${Object.keys(ticketByLista).map(l => `<div class="kpi-sub" style="margin-top:3px;font-family:var(--mono);font-size:.7rem"><span style="color:var(--text);font-weight:500">${l}:</span> ${fmtPesos(ticketByLista[l])}</div>`).join('')}
          </div>
        </div>
        <div class="kpi" style="--kpi-color:var(--accent)">
          <div class="kpi-label">Venta Diaria Prom.</div>
          <div class="kpi-value" style="font-size:1.35rem">${fmtPesos(avgVentaDiaria)}</div>
          <div class="kpi-sub">${activeDays} días con ventas</div>
        </div>
      </div>

      <div class="v-charts-row-2big">
        <div class="panel">
          <div class="panel-header" style="padding:.75rem 1rem">
            <span class="panel-title" style="font-size:.82rem">FACTURACIÓN POR ARTÍCULO</span>
            <span class="badge">${topArts.length} SKUs</span>
            ${topArts.length > 12 ? '<span style="font-size:.65rem;color:var(--muted);font-family:var(--mono);margin-left:.4rem">scroll para ver más</span>' : ''}
          </div>
          <div class="v-chart-scroll" style="padding:.75rem 1rem 1rem;height:320px">
            <div style="height:${Math.max(topArts.length * 28, 290)}px"><canvas id="chartArt"></canvas></div>
          </div>
        </div>
        <div class="panel">
          <div class="panel-header" style="padding:.75rem 1rem">
            <span class="panel-title" style="font-size:.82rem">FACTURACIÓN POR PROVEEDOR</span>
            <span class="badge">${topProvs.length} proveedores</span>
            ${topProvs.length > 12 ? '<span style="font-size:.65rem;color:var(--muted);font-family:var(--mono);margin-left:.4rem">scroll para ver más</span>' : ''}
          </div>
          <div class="v-chart-scroll" style="padding:.75rem 1rem 1rem;height:320px">
            <div style="height:${Math.max(topProvs.length * 28, 290)}px"><canvas id="chartProv"></canvas></div>
          </div>
        </div>
      </div>

      <div class="panel" style="margin-bottom:1.25rem">
        <div class="panel-header" style="padding:.75rem 1rem">
          <span class="panel-title" style="font-size:.82rem">FACTURACIÓN POR FECHA</span>
          <span class="badge">${fechaBadge}</span>
        </div>
        <div style="padding:.75rem 1rem 1rem;height:290px"><canvas id="chartFecha"></canvas></div>
      </div>

      <div class="v-charts-row-colortalle">
        ${colorLabels.length ? `<div class="panel chart-clickable">
          <div class="panel-header" style="padding:.75rem 1rem">
            <span class="panel-title" style="font-size:.78rem">COLOR</span>
            ${vColoresFilter.size>0?`<span class="badge warning">${vColoresFilter.size} activos</span>`:'<span style="font-size:.65rem;color:var(--muted);font-family:var(--mono)">click para filtrar</span>'}
          </div>
          <div style="padding:.5rem 1rem 1rem;height:210px"><canvas id="chartColor"></canvas></div>
        </div>` : ''}
        ${talleLabels.length ? `<div class="panel chart-clickable">
          <div class="panel-header" style="padding:.75rem 1rem">
            <span class="panel-title" style="font-size:.78rem">CURVA DE TALLE</span>
            ${vTallesFilter.size>0?`<span class="badge warning">${vTallesFilter.size} activos</span>`:'<span style="font-size:.65rem;color:var(--muted);font-family:var(--mono)">click para filtrar</span>'}
          </div>
          <div style="padding:.5rem 1rem 1rem;height:210px"><canvas id="chartTalle"></canvas></div>
        </div>` : ''}
      </div>

      <div class="v-charts-row-3equal">
        ${listaLabels.length ? `<div class="panel chart-clickable">
          <div class="panel-header" style="padding:.75rem 1rem">
            <span class="panel-title" style="font-size:.78rem">LISTA DE PRECIOS</span>
            ${vListaFilter.size>0?`<span class="badge warning">${vListaFilter.size} activos</span>`:'<span style="font-size:.65rem;color:var(--muted);font-family:var(--mono)">click para filtrar</span>'}
          </div>
          <div style="padding:.5rem 1rem 1rem;height:210px"><canvas id="chartLista"></canvas></div>
        </div>` : ''}
        ${origenLabels.length ? `<div class="panel chart-clickable">
          <div class="panel-header" style="padding:.75rem 1rem">
            <span class="panel-title" style="font-size:.78rem">ORIGEN VENTA</span>
            ${vOrigenFilter.size>0?`<span class="badge warning">${vOrigenFilter.size} activos</span>`:'<span style="font-size:.65rem;color:var(--muted);font-family:var(--mono)">click para filtrar</span>'}
          </div>
          <div style="padding:.5rem 1rem 1rem;height:210px"><canvas id="chartOrigen"></canvas></div>
        </div>` : ''}
        ${vendedorLabels.length ? `<div class="panel chart-clickable">
          <div class="panel-header" style="padding:.75rem 1rem">
            <span class="panel-title" style="font-size:.78rem">VENDEDOR</span>
            ${vVendedores.size>0?`<span class="badge warning">${vVendedores.size} activos</span>`:'<span style="font-size:.65rem;color:var(--muted);font-family:var(--mono)">click para filtrar</span>'}
          </div>
          <div style="padding:.5rem 1rem 1rem;height:210px"><canvas id="chartVendedor"></canvas></div>
        </div>` : ''}
      </div>

      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Facturas Mayoristas</span>
          <span class="badge">${mayoristaData.distinctClientCount} clientes</span>
          <span class="badge">${mayoristaFacturas.length} facturas</span>
          <span class="badge success">${fmtPesos(mayoristaTotal)}</span>
          <span class="badge">${Math.round(mayoristaUnidades).toLocaleString('es-AR')} u</span>
          ${mayoristaVendedorEntries.length ? `<span style="font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-left:auto">${mayoristaVendedorEntries.map(([v,n]) => `${v}: ${n}`).join(' · ')}</span>` : ''}
        </div>
        ${mayoristaData.groups.length ? mayoristaGroupsHTML : '<div class="empty">No hay facturas de lista Mayorista o Lista 3 para los filtros aplicados.</div>'}
      </div>`;

    if (typeof Chart === 'undefined') return;

    const fmtM = v => '$ ' + (v>=1000000?(v/1000000).toFixed(1)+'M':v>=1000?(v/1000).toFixed(0)+'k':Math.round(v));
    const monoFont = { family: 'DM Mono, monospace' };

    const ctxArt = document.getElementById('chartArt');
    if (ctxArt && topArts.length) {
      _vCharts.art = new Chart(ctxArt, {
        type: 'bar',
        data: { labels: artLabels, datasets: [{ data: artVals, backgroundColor: 'rgba(30,58,138,.7)', borderColor: '#1e3a8a', borderWidth: 1, borderRadius: 2 }] },
        options: {
          indexAxis: 'y', responsive: true, maintainAspectRatio: false,
          layout: { padding: { right: 48 } },
          onClick: (evt, els) => { if (!els.length) return; const l=artLabels[els[0].index]; if(vArticulosFilter.has(l))vArticulosFilter.delete(l);else vArticulosFilter.add(l); renderVentas(); },
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ' '+fmtM(ctx.raw)+' ('+artPcts[ctx.dataIndex]+'%)' } } },
          scales: {
            x: { grid: { color: '#f0eeeb' }, ticks: { font: monoFont, callback: v=>fmtM(v), maxTicksLimit: 5 } },
            y: { ticks: { font: { ...monoFont, size: 11 } } }
          }
        },
        plugins: [{
          afterDraw(chart) {
            const c = chart.ctx;
            chart.getDatasetMeta(0).data.forEach((bar, i) => {
              c.save();
              c.font = '700 10px DM Mono, monospace';
              c.fillStyle = '#d97706';
              c.textAlign = 'left';
              c.textBaseline = 'middle';
              c.fillText(artPcts[i] + '%', bar.x + 5, bar.y);
              c.restore();
            });
          }
        }]
      });
    }

    const ctxProv = document.getElementById('chartProv');
    if (ctxProv && topProvs.length) {
      _vCharts.prov = new Chart(ctxProv, {
        type: 'bar',
        data: { labels: provLabels, datasets: [{ data: provVals, backgroundColor: 'rgba(30,58,138,.7)', borderColor: '#1e3a8a', borderWidth: 1, borderRadius: 2 }] },
        options: {
          indexAxis: 'y', responsive: true, maintainAspectRatio: false,
          layout: { padding: { right: 48 } },
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ' '+fmtM(ctx.raw)+' ('+provPcts[ctx.dataIndex]+'%)' } } },
          scales: {
            x: { grid: { color: '#f0eeeb' }, ticks: { font: monoFont, callback: v=>fmtM(v), maxTicksLimit: 5 } },
            y: { ticks: { font: { ...monoFont, size: 11 } } }
          }
        },
        plugins: [{
          afterDraw(chart) {
            const c = chart.ctx;
            chart.getDatasetMeta(0).data.forEach((bar, i) => {
              c.save();
              c.font = '700 10px DM Mono, monospace';
              c.fillStyle = '#d97706';
              c.textAlign = 'left';
              c.textBaseline = 'middle';
              c.fillText(provPcts[i] + '%', bar.x + 5, bar.y);
              c.restore();
            });
          }
        }]
      });
    }

    const ctxFecha = document.getElementById('chartFecha');
    if (ctxFecha && fechaLabels.length) {
      _vCharts.fecha = new Chart(ctxFecha, {
        type: 'line',
        data: {
          labels: fechaLabels,
          datasets: [
            { label: 'Facturación', data: fechaVals, borderColor: '#1e3a8a', backgroundColor: 'rgba(30,58,138,.1)', borderWidth: 1.5, fill: true, tension: 0.2, pointRadius: fechaLabels.length > 60 ? 0 : 2 },
            { label: 'Media móvil', data: fechaMA, borderColor: '#d97706', borderWidth: 1.5, borderDash: [6,3], fill: false, tension: 0, pointRadius: 0 }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` $ ${Math.round(ctx.raw).toLocaleString('es-AR')}` } } },
          scales: {
            x: { grid: { display: false }, ticks: { font: { ...monoFont, size: 9 }, maxTicksLimit: 20, maxRotation: 45 } },
            y: { grid: { color: '#f0eeeb' }, ticks: { font: { ...monoFont, size: 9 }, callback: v=>fmtM(v) } }
          }
        }
      });
    }

    const makeDonut = (canvasId, labels, data, onClickFn, isMoney=false, customColors=null) => {
      const ctx = document.getElementById(canvasId);
      if (!ctx || !labels.length) return null;
      const total = data.reduce((s,v)=>s+v,0) || 1;
      const bgColors = customColors || DONUT_COLORS.slice(0,labels.length);
      return new Chart(ctx, {
        type: 'doughnut',
        data: { labels, datasets: [{ data, backgroundColor: bgColors, borderWidth: 1.5, borderColor: '#fff' }] },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '58%',
          onClick: (evt, els) => { if (!els.length||!onClickFn) return; onClickFn(labels[els[0].index]); },
          plugins: {
            legend: {
              position: 'right',
              labels: {
                font: { ...monoFont, size: 9 }, boxWidth: 10, padding: 5,
                generateLabels: chart => labels.map((lbl,i) => ({
                  text: isMoney
                    ? `${lbl} (${(data[i]/total*100).toFixed(1)}%)`
                    : `${lbl} (${(data[i]/total*100).toFixed(2).replace('.',',')}%)`,
                  fillStyle: bgColors[i]||'#ccc', strokeStyle: '#fff', lineWidth: 1, index: i,
                  fontColor: '#374151'
                }))
              }
            },
            tooltip: { callbacks: { label: ctx => isMoney
              ? ` ${ctx.label}: ${fmtM(ctx.raw)} (${(ctx.raw/total*100).toFixed(1)}%)`
              : ` ${ctx.label}: ${ctx.raw.toLocaleString('es-AR')} u (${(ctx.raw/total*100).toFixed(1)}%)`
            }}
          }
        }
      });
    };

    const COLOR_HEX = {
      'E1':'#4ade80', 'G1':'#d4b896', 'H1':'#f5f5f5', 'H2':'#1f2937',
      'P4':'#9ca3af', 'G3':'#7c5c3e', 'C4':'#1e3a8a', 'C6':'#3b82f6',
      'D1':'#f97316', 'B1':'#ef4444', 'H3':'#6b7280', 'H0':'#e8d5b0',
      'I0':'#7dd3fc'
    };
    const colorBgs = colorLabels.map(lbl => COLOR_HEX[lbl.toUpperCase()] || DONUT_COLORS[colorLabels.indexOf(lbl) % DONUT_COLORS.length]);
    _vCharts.color  = makeDonut('chartColor',  colorLabels,  colorUnits,  lbl => { if(vColoresFilter.has(lbl))vColoresFilter.delete(lbl);else vColoresFilter.add(lbl); renderVentas(); }, false, colorBgs);
    _vCharts.lista  = makeDonut('chartLista',  listaLabels,  listaVals,   lbl => { if(vListaFilter.has(lbl))vListaFilter.delete(lbl);else vListaFilter.add(lbl); renderVentas(); }, true);
    _vCharts.origen = makeDonut('chartOrigen', origenLabels, origenVals,  lbl => { if(vOrigenFilter.has(lbl))vOrigenFilter.delete(lbl);else vOrigenFilter.add(lbl); renderVentas(); }, true);
    _vCharts.vendedor = makeDonut('chartVendedor', vendedorLabels, vendedorVals, lbl => { if(vVendedores.has(lbl))vVendedores.delete(lbl);else vVendedores.add(lbl); renderVentas(); }, true);

    const ctxTalle = document.getElementById('chartTalle');
    if (ctxTalle && talleLabels.length) {
      const talleBgColors = talleLabels.map(t => vTallesFilter.has(t) ? 'rgba(30,58,138,.95)' : 'rgba(30,58,138,.55)');
      _vCharts.talle = new Chart(ctxTalle, {
        type: 'bar',
        data: { labels: talleLabels, datasets: [{ data: talleUnits, backgroundColor: talleBgColors, borderColor: '#1e3a8a', borderWidth: 1, borderRadius: 2 }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          onClick: (evt, els) => { if (!els.length) return; const l=talleLabels[els[0].index]; if(vTallesFilter.has(l))vTallesFilter.delete(l);else vTallesFilter.add(l); renderVentas(); },
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${ctx.raw.toLocaleString('es-AR')} u` } } },
          scales: {
            x: { grid: { display: false }, ticks: { font: { ...monoFont, size: 9 } } },
            y: { grid: { color: '#f0eeeb' }, ticks: { font: { ...monoFont, size: 9 } } }
          }
        }
      });
    }
  }

  // SETUP / CONNECT
  async function connect() {
    VENTAS_SHEETS_ID = document.getElementById('ventasSheetsId').value.trim() || VENTAS_SHEETS_ID_DEFAULT;
    VENTAS_PUB_ID = document.getElementById('ventasPubId').value.trim() || VENTAS_PUB_ID_DEFAULT;
    VENTAS_GID = document.getElementById('ventasGidInput').value.trim() || VENTAS_GID_DEFAULT;
    const err = document.getElementById('errorMsg');
    err.style.display = 'none';
    const btn = document.querySelector('#setup .btn');
    btn.disabled = true; btn.textContent = 'Cargando…';
    localStorage.setItem('ventas_sheets_id', VENTAS_SHEETS_ID);
    localStorage.setItem('ventas_pub_id', VENTAS_PUB_ID);
    localStorage.setItem('ventas_gid', VENTAS_GID);
    document.getElementById('setup').style.display = 'none';
    document.getElementById('dashboard').style.display = 'flex';
    loadData();
  }

  function resetConfig() {
    ['ventas_sheets_id','ventas_pub_id','ventas_gid'].forEach(k => localStorage.removeItem(k));
    location.reload();
  }

  window.addEventListener('DOMContentLoaded', () => {
    const sid = localStorage.getItem('ventas_sheets_id');
    const pid = localStorage.getItem('ventas_pub_id');
    const gid = localStorage.getItem('ventas_gid');
    if (sid) {
      VENTAS_SHEETS_ID = sid;
      VENTAS_PUB_ID = pid || VENTAS_PUB_ID_DEFAULT;
      VENTAS_GID = gid || VENTAS_GID_DEFAULT;
      document.getElementById('setup').style.display = 'none';
      document.getElementById('dashboard').style.display = 'flex';
      loadData();
    }
    setInterval(() => { if (VENTAS_SHEETS_ID) loadData(); }, 300000);
  });
</script>
</body>
</html>
